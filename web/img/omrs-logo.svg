<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="90" fill="white" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Left optical lens -->
  <circle cx="70" cy="100" r="22" fill="none" stroke="url(#grad1)" stroke-width="3"/>
  
  <!-- Right optical lens -->
  <circle cx="130" cy="100" r="22" fill="none" stroke="url(#grad1)" stroke-width="3"/>
  
  <!-- Connecting line -->
  <line x1="92" y1="100" x2="108" y2="100" stroke="url(#grad1)" stroke-width="3"/>
  
  <!-- Center dot -->
  <circle cx="100" cy="100" r="4" fill="url(#grad1)"/>
  
  <!-- Data layers below -->
  <line x1="60" y1="135" x2="140" y2="135" stroke="url(#grad1)" stroke-width="2.5" opacity="0.8"/>
  <line x1="60" y1="148" x2="140" y2="148" stroke="url(#grad1)" stroke-width="2.5" opacity="0.6"/>
</svg>
